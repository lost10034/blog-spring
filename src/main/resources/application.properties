spring.application.name=blog
spring.threads.virtual.enabled=true
spring.sql.init.mode=always
spring.datasource.url=jdbc:mariadb://localhost:3306/blog
spring.datasource.username=blog
spring.datasource.password=${DB_PASSWORD}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
sendcloud.api-user=${SENDCLOUD_API_USER}
sendcloud.api-key=${SENDCLOUD_API_KEY}
aliyun.accesskey-id=${ALIYUN_ACCESSKEY_ID}
aliyun.accesskey-secret=${ALIYUN_ACCESSKEY_SECRET}
